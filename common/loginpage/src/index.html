    <style>
      /* WorkSuite loading screen: navy in light and dark themes alike, painted before any script runs */
      #loading-mask.ws-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #001842;
        z-index: 1000;
        transition: opacity 0.45s ease;
      }
      #loading-mask.ws-splash--hide { opacity: 0; pointer-events: none; }
      .ws-splash__anim { width: min(640px, 92vw); aspect-ratio: 640 / 400; }
      @media (prefers-reduced-motion: reduce) { #loading-mask.ws-splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="loading-mask" class="loadmask ws-splash" role="status" aria-label="Loading WorkSuite Office">
        <div id="ws-splash-anim" class="ws-splash__anim"></div>
      </div>
      <div id="root"></div>
    </div>
