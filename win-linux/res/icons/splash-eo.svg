        <path d="M0 0h500v250H0V0Z" fill="#fff"/>
        <!-- Gray border (kept from original) -->
        <path d="M499 1v248H1V1h498ZM0 0v250h500V0H0Z" fill="#ACACAC"/>

        <!-- WorkSuite app icon on the left (replaces the three colored shapes) -->
        <svg x="25" y="45" width="160" height="160" viewBox="72 72 880 880"><defs><linearGradient id="wsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4766E8"/><stop offset="1" stop-color="#2434A0"/></linearGradient></defs><rect x="72" y="72" width="880" height="880" rx="200" fill="url(#wsg)"/><path d="M302 365 395 660 512 437 628 660 722 365" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <!-- Title: "WorkSuite" (bold) + " Desktop Editors" (regular) -->
        <text x="485" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#333" text-anchor="end">Office</text>
        <text x="427" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="end">WorkSuite</text>

