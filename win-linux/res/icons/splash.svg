<svg width="500" height="250" viewBox="0 0 500 250" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- WorkSuite Office launch splash: the still WorkSuite logo ("flash" at rest) and the name on #121b34, the
         same as the start page's launch screen (common/loginpage/src/index.html), so the hand-over does not
         flicker. Qt's splash renders it once, statically. -->
    <rect width="500" height="250" fill="#121b34"/>
    <g transform="translate(206 50) scale(0.6875)">
        <rect x="16" y="48" width="32" height="32" fill="#00daf2"/>
        <rect x="48" y="80" width="32" height="32" fill="#00daf2"/>
        <rect x="48" y="16" width="64" height="64" fill="#0a6cff"/>
        <rect x="48" y="48" width="32" height="32" fill="#001842"/>
    </g>
    <text x="250" y="170" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600">WorkSuite Office</text>
</svg>
